name: test-packaging

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, dev, sync, dev_wrap]

jobs:
  distributions:
    name: Build and install distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install build tools
        run: python -m pip install --upgrade build twine
      - name: Build source and wheel distributions
        run: python -m build
      - name: Check distribution metadata
        run: python -m twine check dist/*
      - name: Verify wheel contents
        run: python packaging_tests/check_wheel.py dist/*.whl
      - name: Install wheel in a clean environment
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/pvade-wheel-env"
          "$RUNNER_TEMP/pvade-wheel-env/bin/python" -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/pvade-wheel-env/bin/python" -m pip show pvade
          "$RUNNER_TEMP/pvade-wheel-env/bin/python" -c 'import pvade; from importlib.resources import files; print(pvade.__file__); assert files("pvade.IO").joinpath("input_schema.yaml").is_file()'
          "$RUNNER_TEMP/pvade-wheel-env/bin/pvade" --help
          "$RUNNER_TEMP/pvade-wheel-env/bin/python" -m pvade --help
          "$RUNNER_TEMP/pvade-wheel-env/bin/python" -m pvade_main --help