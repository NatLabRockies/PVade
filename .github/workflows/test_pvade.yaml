name: test_pvade

on:
  push:
    branches: [ main ]
    # branches: [ main, dev ]
  pull_request:



    branches: [ main, dev, sync, dev_wrap]




concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Job 1 of 2 - run pytest on code
  pytest:
    name: Pytest
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - name: Build Conda environment
        uses: conda-incubator/setup-miniconda@v3
        with:
          # auto-update-conda: true
          python-version: "3.10"
          environment-file: environment.yaml
          activate-environment: pvade
      - name: Install PVade editable without resolving Conda dependencies
        shell: bash -l {0}
        run: python -m pip install --no-deps -e .
      - name: Run pytest (unit, input-validation and regression tests) with coverage
        shell: bash -l {0}
        run: PYTHONPATH=. pytest -sv pvade/tests/ --cov=pvade --cov-report=term --cov-report=xml
      - name: Summarize pytest results and coverage
        if: always()
        shell: bash -l {0}
        run: |
          {
            echo "### Pytest on ${{ matrix.os }} (job status: ${{ job.status }})"
            echo
            echo "Suite: \`pvade/tests\` (unit, input-validation and solver regression tests), $(python --version 2>&1)."
            if [ -f .coverage ]; then
              echo
              echo "Line coverage of the \`pvade\` package. This is informational only: MPI runs launched as subprocesses are not measured."
              echo
              python -m coverage report --format=markdown
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: coverage-${{ matrix.os }}
          path: coverage.xml
          if-no-files-found: ignore
          retention-days: 7
      - name: Run every example input file (mesh only and short solve)
        env:
          OMPI_MCA_regx: "naive"
        shell: bash -l {0}
        run: pytest -sv  test_all_inputs.py
      - name: Summarize input-file runs
        if: always()
        shell: bash -l {0}
        run: |
          {
            echo "### Example input files on ${{ matrix.os }} (job status: ${{ job.status }})"
            echo
            echo "\`test_all_inputs.py\` ran each YAML file in \`examples/\` through \`mpirun -n 1 python pvade_main.py\`, once mesh-only and once with a short solve."
          } >> "$GITHUB_STEP_SUMMARY"

  # Job 2 of 2 - enforce Black formatting
  formatting:
    name: Black formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: psf/black@stable
